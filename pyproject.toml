###########################################################
# Project setup:
###########################################################
[build-system]
# >=77 for the SPDX `license` expression and `license-files` (PEP 639).
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qewton"
version = "0.1.1"
description = "Deep Learning Framework for Application Problems"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Tom Freudenberg", email = "tomfre@uni-bremen.de" },
           { name = "Nick Heilenkötter", email = "heilenkoetter@uni-bremen.de" }]
requires-python = ">=3.10"
keywords = [
    "deep learning",
    "scientific machine learning",
    "operator learning",
    "physics-informed neural networks",
    "pinn",
    "neural operators",
    "pde",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
]
# The core install has no deep learning backend; pick one via the extras
# below, e.g. `pip install "qewton[torch]"`.
dependencies = [
    "numpy>=2.2",
    "matplotlib>=3.10",
    "tqdm>=4.65",
    # Loading mesh files (.msh, .vtk, .xdmf, ...) via MeshGeometry.load_mesh
    "meshio>=5.3",
    # Jupyter kernel: run notebooks (e.g. the examples) in Jupyter or VS Code
    "ipykernel>=6.0",
]

# Optional features. Extras combine with commas: pip install "qewton[torch,gmsh]"
[project.optional-dependencies]
# --- Deep learning backends ---
torch = ["torch>=2.5"]
# --- Geometries ---
# Mesh CAD files (STEP, STL, BREP, ...) via create_mesh_geometry
gmsh = ["gmsh>=4.11"]
# --- Visualization ---
# Plotly renderer, static image export (kaleido) and geometry cards (shapely)
plotly = ["plotly>=6.1", "kaleido>=1.0", "shapely>=2.0"]
# DashApplication: figures as an interactive web app
dash = ["dash>=3.0", "plotly>=6.1"]
# WidgetApplication: interactive figures in Jupyter notebooks
widgets = ["ipywidgets>=8.0", "ipympl>=0.9"]
# --- Training ---
# OptunaTuner and TuningAnalyzer
tuning = ["optuna>=4.0", "pandas>=2.0"]
# TensorboardLogger (also needs the torch extra)
tensorboard = ["tensorboard>=2.14"]
# HDF5DataSet
hdf5 = ["h5py>=3.8"]
# --- Everything ---
all = ["qewton[torch,gmsh,plotly,dash,widgets,tuning,tensorboard,hdf5]"]

[project.urls]
Homepage = "https://github.com/Qewton-Labs/Qewton"
Repository = "https://github.com/Qewton-Labs/Qewton"
Issues = "https://github.com/Qewton-Labs/Qewton/issues"
Documentation = "https://qewton-labs.github.io/Qewton/"
Changelog = "https://github.com/Qewton-Labs/Qewton/blob/main/CHANGELOG.rst"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

###########################################################
# Formatting setup:
###########################################################
[tool.pyright]
reportIncompatibleMethodOverride = "none"

[tool.black]
line-length = 90
skip-string-normalization = false
target-version = ["py310"]

[tool.pylint.main]
py-version = "3.10"
ignore = [
  "venv",
  ".venv",
  "__pycache__",
]

[tool.pylint.messages_control]
disable = [
  "missing-module-docstring",
  "missing-class-docstring",
  "missing-function-docstring",
  "duplicate-code",
  "fixme",
  "too-few-public-methods",
  "E0402",
  "R0902",
  "C0415",
  "W0221"
]

[tool.pylint.format]
max-line-length = 90
indent-string = "    "

[tool.pylint.naming]
function-naming-style = "snake_case"
method-naming-style = "snake_case"
variable-naming-style = "snake_case"
class-naming-style = "PascalCase"
const-naming-style = "UPPER_CASE"

[tool.pylint.design]
max-args = 10
max-locals = 15
max-branches = 12
max-statements = 50
max-returns = 5
max-positional-arguments = 12

[tool.pylint.reports]
reports = false
score = true

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["examples", ".*", "build", "dist", "venv"]

# Development-only dependencies (PEP 735): not published as extras.
# Install with `pip install --group dev` (pip>=25.1) or `uv sync`.
[dependency-groups]
dev = [
    "neuraloperator>=2.0.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.6",
]
docs = [
    "sphinx>=8.0",
    "sphinx-autoapi>=3.0",
    "furo>=2024.1",
    "m2r2>=0.3",
]
